# GENERATED by scripts/k8s-gen-configmaps.sh from: --from-file=localstack/init-aws.sh
# Do not edit — change the source file(s) and re-run the script.
apiVersion: v1
data:
  init-aws.sh: |
    #!/bin/bash
    echo "Creating SQS FIFO queues..."

    echo "Creating dead-letter queue..."

    awslocal sqs create-queue \
      --queue-name skytrack-dlq.fifo \
      --attributes '{
        "FifoQueue": "true",
        "ContentBasedDeduplication": "true",
        "MessageRetentionPeriod": "1209600"
      }'

    DLQ_ARN=$(awslocal sqs get-queue-attributes \
      --queue-url http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/skytrack-dlq.fifo \
      --attribute-names QueueArn \
      --query 'Attributes.QueueArn' --output text)

    if [[ -z "$DLQ_ARN" || "$DLQ_ARN" == "None" ]]; then
      echo "FATAL: could not resolve DLQ ARN — refusing to create positions queue" >&2
      exit 1
    fi

    echo "Creating pipeline queues..."

    awslocal sqs create-queue \
      --queue-name skytrack-positions.fifo \
      --attributes "{
        \"FifoQueue\": \"true\",
        \"ContentBasedDeduplication\": \"true\",
        \"VisibilityTimeout\": \"30\",
        \"RedrivePolicy\": \"{\\\"deadLetterTargetArn\\\":\\\"$DLQ_ARN\\\",\\\"maxReceiveCount\\\":\\\"5\\\"}\"
      }"

    awslocal sqs create-queue \
      --queue-name skytrack-airport-events.fifo \
      --attributes '{
        "FifoQueue": "true",
        "ContentBasedDeduplication": "true",
        "VisibilityTimeout": "30"
      }'

    awslocal sqs create-queue \
      --queue-name skytrack-predictions.fifo \
      --attributes '{
        "FifoQueue": "true",
        "ContentBasedDeduplication": "true",
        "VisibilityTimeout": "30"
      }'

    echo "Queues created:"
    awslocal sqs list-queues

    echo "Creating DynamoDB table..."

    awslocal dynamodb create-table \
      --table-name skytrack-aircraft \
      --attribute-definitions \
        AttributeName=icao24,AttributeType=S \
        AttributeName=sortKey,AttributeType=S \
      --key-schema \
        AttributeName=icao24,KeyType=HASH \
        AttributeName=sortKey,KeyType=RANGE \
      --billing-mode PAY_PER_REQUEST

    awslocal dynamodb update-time-to-live \
      --table-name skytrack-aircraft \
      --time-to-live-specification "Enabled=true,AttributeName=ttl"

    echo "DynamoDB table created:"
    awslocal dynamodb list-tables

    echo "Creating S3 history bucket..."

    awslocal s3 mb s3://skytrack-history

    echo "S3 buckets created:"
    awslocal s3 ls
kind: ConfigMap
metadata:
  name: localstack-init
