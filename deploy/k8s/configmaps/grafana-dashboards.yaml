              "expr": "rate(skytrack_positions_consumed_total[1m])", "legendFormat": "positions/s" }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Landings detected / sec",
          "description": "rate(skytrack_landings_detected_total). LandingEvents emitted by the state machine.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops", "min": 0 }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "single" } },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "rate(skytrack_landings_detected_total[1m])", "legendFormat": "landings/s" }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Predictions emitted (5m window) by classification",
          "description": "increase(skytrack_predictions_total[5m]) per classification. ON_TIME/MINOR stay at zero while delay-threshold-minutes=15 gates them out.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "short", "min": 0, "custom": { "stacking": { "mode": "normal", "group": "A" }, "fillOpacity": 25 } },
