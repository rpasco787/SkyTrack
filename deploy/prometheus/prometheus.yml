# Scrapes the SkyTrack app inside the compose network. 5s matches the Grafana refresh and is
# fast enough that a 12-minute local replay (opensky.poll-rate-ms=2000 in application-local.yml)
# produces smooth rate() curves. Not tuned for production retention.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: skytrack
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["skytrack:8080"]
