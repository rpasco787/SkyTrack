apiVersion: 1
providers:
  - name: skytrack
    type: file
    # Re-read the JSON every 30s so edits to deploy/grafana/dashboards/*.json show up without restart.
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
