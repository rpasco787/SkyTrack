opensky:
  mode: replay
  replay-dir: ./data/recorded-opensky/
  replay-speed-multiplier: 1
  poll-rate-ms: 2000    # 15x faster than prod default for local replay

sqs:
  endpoint: http://localhost:4566
  region: us-east-1
  consumer-threads: 4

aeroapi:
  enabled: true
  base-url: http://localhost:9090/aeroapi
  api-key: mock-api-key

skytrack:
  dynamodb:
    endpoint: http://localhost:4566
  s3:
    endpoint: http://localhost:4566
    flush-interval-seconds: 60

weather:
  mode: replay
  replay-dir: ./data/recorded-weather/
