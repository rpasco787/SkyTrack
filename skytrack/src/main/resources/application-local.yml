opensky:
  mode: replay
  replay-dir: ./data/recorded-opensky/
  replay-speed-multiplier: 1
  poll-rate-ms: 2000    # 15x faster than prod default for local replay
  # Wrap back to the first snapshot when the 370 files run out, so a soak run outlasts the ~3.1h
  # (prod) / ~12min (local) window. Local only: timestamps repeat, so FIFO dedup suppresses some
  # replayed positions and landings re-fire. Never set this where accuracy is being measured — the
  # backtest harnesses iterate until fetchPositions() returns empty and would loop forever.
  replay-loop: true

sqs:
  endpoint: http://localhost:4566
  region: us-east-1
  # Measured 2026-08-06 (docs/throughput-measurements-2026-08-03.md): raising this to 16 does NOT
  # scale throughput. Drain rate is ~430/sec at 4 threads and ~440/sec at 16 — the bottleneck is
  # LocalStack as a shared serialized resource, not thread count. 16 threads also starves the
  # producer (~2,500/sec -> ~532/sec) by competing for the same container. Left at 4 deliberately.
  consumer-threads: 4
  producer-threads: 8

aeroapi:
  enabled: true
  base-url: http://localhost:9090/aeroapi
  api-key: mock-api-key

skytrack:
  dynamodb:
    endpoint: http://localhost:4566
  s3:
    endpoint: http://localhost:4566
    flush-interval-seconds: 60

weather:
  mode: replay
  replay-dir: ./data/recorded-weather/
