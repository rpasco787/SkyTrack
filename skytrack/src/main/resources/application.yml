spring:
  application:
    name: skytrack

management:
  endpoint:
    health:
      # The btsSchedule indicator carries its diagnosis in the details (record count, resolved
      # CSV path); with the default "never" the endpoint reports a bare DOWN and the reason is
      # lost. Revisit if /actuator is ever exposed outside a trusted network.
      show-details: always

opensky:
  mode: replay
  poll-rate-ms: 30000   # producer snapshot cadence; lower = faster replay

sqs:
  positions-queue-name: skytrack-positions.fifo
  airport-events-queue-name: skytrack-airport-events.fifo
  prediction-queue-name: skytrack-predictions.fifo
  consumer-threads: 4   # continuous workers; each blocks on a 20s long-poll when idle

aeroapi:
  enabled: false
  max-monthly-calls: 10000
  request-timeout-ms: 5000

skytrack:
  dynamodb:
    table-name: skytrack-aircraft
    region: us-east-1
  s3:
    bucket: skytrack-history
    region: us-east-1
    prefix: delays
    flush-interval-seconds: 300
  state-machine:
    ground-altitude-meters: 150
    approach-radius-km: 50
    ground-radius-km: 5
    stale-timeout-seconds: 300
    # How long a track may go unwritten when nothing changed. MUST stay below
    # stale-timeout-seconds: a track whose lastSeen falls outside that window resets to
    # UNKNOWN, and a landing observed from UNKNOWN is not emitted.
    persist-interval-seconds: 120
  disruption:
    window-minutes: 60
    bucket-size-minutes: 1
    # Tuned 2026-07-30 against the corrected cascade recall denominator (see
    # docs/accuracy-stages-0-3-analysis.md). Dropping the cascade gate 30 -> 5 raises recall
    # 0.366 -> 0.455 at unchanged precision (0.974 -> 0.972): the gate was refusing to start
    # walks, not filtering bad ones. Going below delay-threshold 10 does start costing precision.
    delay-threshold-minutes: 10
    cascade-threshold-minutes: 5
    cascade-propagation-factor: 0.85
    en-route-recovery-factor: 0.15
    cascade-max-hops: 8
  prediction:
    # Gates the BTS repository: false substitutes an empty one, so OutboundScheduleResolver
    # resolves nothing and the pipeline emits zero predictions without logging a thing.
    # PredictionWiringTest fails if this is turned off.
    enabled: true
    # Relative to the app's working directory (skytrack/), which is NOT the test working
    # directory — surefire runs from the repo root, so tests override this path explicitly.
    bts-csv-path: data/bts/btsdata.csv
    min-turnaround-minutes: 45
    delay-threshold-minutes: 15
    # Past this gap the aircraft has overnighted, so the next leg's delay is not attributable
    # to the arrival that started the rotation walk.
    max-rotation-lookahead-minutes: 360

weather:
  mode: replay
  request-timeout-ms: 5000
  poll-interval-minutes: 15
  cache-ttl-minutes: 30
  target-airports:
    - KORD
    - KATL
    - KJFK
    - KLAX
    - KDFW
