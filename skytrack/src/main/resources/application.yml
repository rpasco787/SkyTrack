spring:
  application:
    name: skytrack

opensky:
  mode: replay

sqs:
  positions-queue-name: skytrack-positions.fifo
  airport-events-queue-name: skytrack-airport-events.fifo

aeroapi:
  enabled: false
  max-monthly-calls: 10000
  request-timeout-ms: 5000

skytrack:
  dynamodb:
    table-name: skytrack-aircraft
    region: us-east-1
  state-machine:
    ground-altitude-meters: 150
    approach-radius-km: 50
    ground-radius-km: 5
    stale-timeout-seconds: 300
